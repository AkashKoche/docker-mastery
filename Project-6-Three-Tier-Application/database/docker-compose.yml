version: '3.8'


services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"


  backend:
    build: ./backend
    ports:
      - "5000:5000"
    depends_on:
      - db


  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: testdb
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.p/init.sql


networks:
  app-network:
    driver: bridge
