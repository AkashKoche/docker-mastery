version: '3.8'


services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2


  app1:
    build:
      context: ./app1
    expose:
      - "5000"


  app2:
    build:
      context: ./app2
    expose:
      - "5001"
